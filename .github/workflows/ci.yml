name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, format, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # --frozen-lockfile: fail if bun.lock and package.json disagree.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      # Unit tests only. They use no database and no secrets.
      - name: Unit tests
        run: bun run test

      # Real PostgreSQL 17 (embedded-postgres binaries, started by the test setup):
      # migrations, RLS, SECURITY DEFINER functions, audit, business day, commission.
      # No credentials, no network services.
      - name: Database tests (real PostgreSQL)
        run: bun run test:db

      # Deliberately built with NO Supabase/payment/etc. environment variables,
      # so CI never needs (or sees) any credentials.
      - name: Build
        run: bun run build
