name: Real Supabase verification (dedicated DEVELOPMENT project)

# Runs the real-Supabase suites against ONE dedicated, disposable development/test project.
# It is NOT part of the normal CI and never touches any other project.
#
# DESTRUCTIVE to that project: it first removes the foundation objects and the `test-*@example.com`
# auth users, re-applies the migrations, runs the browser setup flow and the verification suite.
# Never point these secrets at production or at an unknown project.
#
# Secrets (repository settings > Secrets and variables > Actions), set by the project owner:
#   SUPABASE_TEST_URL, SUPABASE_TEST_PUBLISHABLE_KEY, SUPABASE_TEST_SERVICE_ROLE_KEY,
#   SUPABASE_TEST_DB_URL   (use the Session-pooler string; GitHub runners have no IPv6)
# Variables (not secret):
#   SUPABASE_TEST_PROJECT_REF, SUPABASE_VERIFY_CONFIRM (= this-is-a-dedicated-disposable-test-project),
#   SUPABASE_VERIFY_ALLOW_RESET (= yes)
# See docs/REAL_SUPABASE_VERIFICATION.md.

on:
  workflow_dispatch:
  push:
    branches: ["arena/01a0eece-canna-connec-launchpad"]
    paths:
      - ".github/workflows/real-supabase-verification.yml"
      - "tests/supabase-real/**"
      - "tests/browser/**"
      - "supabase/migrations/**"
      - "src/**"
      - "package.json"
      - "vitest.supabase.config.ts"

permissions:
  contents: read

concurrency:
  group: real-supabase-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Migrate, browser setup, real Auth/RLS/PostgREST suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
      SUPABASE_VERIFY_PROJECT_REF: ${{ vars.SUPABASE_TEST_PROJECT_REF }}
      SUPABASE_VERIFY_CONFIRM: ${{ vars.SUPABASE_VERIFY_CONFIRM }}
      SUPABASE_VERIFY_ALLOW_RESET: ${{ vars.SUPABASE_VERIFY_ALLOW_RESET }}
      BROWSER_TOOLS_DIR: /tmp/rt
      SUPABASE_VERIFY_BROWSER_SETUP_FILE: /tmp/browser-setup-handoff.json
    steps:
      - name: Check that the dedicated-project configuration is present (values are not printed)
        run: |
          missing=0
          for v in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL \
                   SUPABASE_VERIFY_PROJECT_REF SUPABASE_VERIFY_CONFIRM SUPABASE_VERIFY_ALLOW_RESET; do
            if [ -z "${!v}" ]; then echo "::error::$v is not configured"; missing=1; fi
          done
          exit $missing

      - run: mkdir -p /tmp/real-logs

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Install browser tooling (outside the repository)
        run: |
          mkdir -p "$BROWSER_TOOLS_DIR" && cd "$BROWSER_TOOLS_DIR"
          npm init -y >/dev/null
          npm i --no-audit --no-fund wrangler@4 @sparticuz/chromium puppeteer-core

      - name: Reset the disposable project
        run: bun run test:supabase:reset 2>&1 | tee "/tmp/real-logs/01-reset.log"

      - name: Apply migrations to the real project
        run: bun run test:supabase:migrate 2>&1 | tee "/tmp/real-logs/02-migrate.log"

      - name: Browser check of the production build against the REAL backend
        run: bun run test:browser:real 2>&1 | tee "/tmp/real-logs/03-browser-real.log"

      - name: Real Supabase verification suite (catalog, PostgREST, Auth, quickLogin)
        run: bun run test:supabase 2>&1 | tee "/tmp/real-logs/04-suite.log"

      - name: Leave the project clean of test users
        if: always()
        run: bun run test:supabase:reset 2>&1 | tee "/tmp/real-logs/05-cleanup.log"

      - name: Keep the logs as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-supabase-verification-logs
          path: /tmp/real-logs/*.log
          if-no-files-found: warn
